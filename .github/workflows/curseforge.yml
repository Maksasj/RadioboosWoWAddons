name: Package & Release Addons

on:
  push:
    tags:
      - 'v*'      # Triggers on version tags (e.g., v1.0.0, v1.2.1)
      - '*/*'     # Triggers on addon-specific tags (e.g., Grouperio/v1.0.0)
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - name: 'Grouperio'
            path: 'Grouperio'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Packager for ${{ matrix.addon.name }}
        uses: BigWigsMods/packager@v2
        working-directory: ${{ matrix.addon.path }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
